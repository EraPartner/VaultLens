# Lint contract for the wiki tooling (tools/**). Pins the rule set so the local
# .githooks (pre-commit/pre-push) and CI (.github/workflows/ci.yml) agree across
# ruff versions. `ruff check` only — formatting is intentionally NOT enforced
# (the tree predates `ruff format`; enabling it later is a separate, deliberate pass).
target-version = "py311"

[lint]
# Ruff's default rule set, stated explicitly: pyflakes (F) + a safe slice of
# pycodestyle errors (E4 imports, E7 statements, E9 syntax). Broaden deliberately.
select = ["E4", "E7", "E9", "F", "ANN"]

# ANN (annotations) is a ratchet alongside the basedpyright baseline (tools/typing-baseline.json).
# Files listed here predate the rule. Shrink only: delete an entry once its file is annotated;
# never add one. New files are checked from their first commit.
[lint.per-file-ignores]
"tests/test_host_repairs.py" = ["ANN"]
"tests/test_macos_processes.py" = ["ANN"]
"tests/test_runtime_deploy.py" = ["ANN"]
"tests/test_runtime_maintenance.py" = ["ANN"]
"tests/test_runtime_probe.py" = ["ANN"]
"tests/test_runtime_verification.py" = ["ANN"]
"tests/test_schedule_recovery.py" = ["ANN"]
