# Type-check contract for the wiki tooling (tools/**). Dev-only: mypy is not a
# runtime dependency (the tooling stays stdlib-only). Run through the ratchet gate:
#   python3 tools/scripts/typing_gate.py
# Strict applies to every file. Files that do not pass yet are listed in
# tools/typing-debt.txt and are excluded from the gate until fixed; unlisted
# (new or already clean) files must stay clean.
[mypy]
python_version = 3.11
strict = True
warn_unreachable = True
explicit_package_bases = True
# Scripts put these directories on sys.path at runtime; mirror that here.
mypy_path = tools:tools/schedule:tools/runtime:tools/scripts
# Errors in imported-but-not-gated (debt) modules must not fail clean files.
follow_imports = silent
